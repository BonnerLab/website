---
layout: default
---

<div class="row" style="padding-top: 0;">
  <div id="homeid" class="col-sm-7">
    <h2 style="margin-top: 0; margin-bottom: 12px; font-size: 2.2em;">Cognitive Neuroscience and Deep Learning Group</h2>
    {{ content }}
  </div>
  <div id="newsid" class="col-sm-5">
    {% include news.html %}
    <div id="animation-container" style="position: relative; width: 100%; height: 375px; margin-top: 20px; background-color: white; border: 1px solid #f0f0f0; border-radius: 4px; overflow: hidden;">
      <canvas id="network-animation"></canvas>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('network-animation');
  const container = document.getElementById('animation-container');
  const ctx = canvas.getContext('2d');
  
  // Set canvas size to container size
  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  // Particle system
  const particles = [];
  const particleCount = 100; // Reduced particles for clearer node spacing
  const particleRadius = 2; // Slightly larger particles for visibility
  
  // Animation states
  let currentFormation = 0; // 0: eye, 1: brain, 2: neural network
  let animationPhase = 0; // 0: random, 1: forming, 2: formed, 3: dispersing
  let phaseTimer = 0;
  let transitionProgress = 0;
  
  // Modern blue color for all particles
  const particleColor = 'rgba(59, 130, 246, 0.9)'; // Modern blue
  
  // Get formation positions based on current formation type
  function getFormationPosition(index, total, formationType) {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    switch(formationType) {
      case 0: // Eye formation
        return getEyePosition(index, total, centerX, centerY);
      case 1: // Brain formation
        return getBrainPosition(index, total, centerX, centerY);
      case 2: // Neural network formation
        return getNeuralNetworkPosition(index, total, centerX, centerY);
      default:
        return { x: centerX, y: centerY };
    }
  }
  
  // Eye formation
  function getEyePosition(index, total, centerX, centerY) {
    const eyeWidth = Math.min(canvas.width * 0.7, 220);
    const eyeHeight = Math.min(canvas.height * 0.35, 90);
    
    if (index < total * 0.4) {
      // Upper eyelid
      const t = index / (total * 0.4);
      const angle = Math.PI * t;
      const x = centerX - eyeWidth/2 + eyeWidth * t;
      const y = centerY - Math.sin(angle) * eyeHeight/2;
      return { x, y };
    } else if (index < total * 0.8) {
      // Lower eyelid
      const t = (index - total * 0.4) / (total * 0.4);
      const angle = Math.PI * t;
      const x = centerX + eyeWidth/2 - eyeWidth * t;
      const y = centerY + Math.sin(angle) * eyeHeight/2;
      return { x, y };
    } else if (index < total * 0.95) {
      // Iris
      const irisIndex = index - total * 0.8;
      const irisTotal = total * 0.15;
      const angle = (irisIndex / irisTotal) * Math.PI * 2;
      const irisRadius = eyeHeight / 3;
      const x = centerX + Math.cos(angle) * irisRadius;
      const y = centerY + Math.sin(angle) * irisRadius;
      return { x, y };
    } else {
      // Pupil
      const pupilIndex = index - total * 0.95;
      const pupilTotal = total * 0.05;
      const angle = (pupilIndex / pupilTotal) * Math.PI * 2;
      const pupilRadius = eyeHeight / 8;
      const x = centerX + Math.cos(angle) * pupilRadius;
      const y = centerY + Math.sin(angle) * pupilRadius;
      return { x, y };
    }
  }
  
  // Brain formation - traced from reference image
  function getBrainPosition(index, total, centerX, centerY) {
    const brainWidth = Math.min(canvas.width * 0.6, 180);
    const brainHeight = Math.min(canvas.height * 0.5, 150);
    
    const t = index / total;
    
    let x, y;
    
    if (t < 0.7) {
      // Main brain outline - manually traced points
      const outlineT = t / 0.7;
      
      // Define key points for brain outline (normalized -0.5 to 0.5)
      const brainPoints = [
        // Start at front bottom (temporal lobe)
        {x: 0.3, y: 0.25},
        {x: 0.35, y: 0.15},
        {x: 0.4, y: 0.05},
        {x: 0.42, y: -0.05},
        // Frontal lobe bulge
        {x: 0.43, y: -0.15},
        {x: 0.4, y: -0.25},
        {x: 0.35, y: -0.35},
        // Top front
        {x: 0.25, y: -0.42},
        {x: 0.15, y: -0.45},
        // Top
        {x: 0.05, y: -0.47},
        {x: -0.05, y: -0.47},
        {x: -0.15, y: -0.45},
        // Back top
        {x: -0.25, y: -0.4},
        {x: -0.32, y: -0.32},
        // Occipital lobe
        {x: -0.38, y: -0.2},
        {x: -0.4, y: -0.1},
        {x: -0.4, y: 0},
        {x: -0.38, y: 0.1},
        // Bottom back (above cerebellum)
        {x: -0.35, y: 0.2},
        {x: -0.3, y: 0.25},
        // Under temporal area
        {x: -0.2, y: 0.3},
        {x: -0.1, y: 0.32},
        {x: 0, y: 0.33},
        {x: 0.1, y: 0.32},
        {x: 0.2, y: 0.3},
        // Close the loop
        {x: 0.3, y: 0.25}
      ];
      
      // Interpolate between points
      const totalPoints = brainPoints.length - 1;
      const pointIndex = Math.min(Math.floor(outlineT * totalPoints), totalPoints - 1);
      const localT = (outlineT * totalPoints) - pointIndex;
      
      const p1 = brainPoints[pointIndex];
      const p2 = brainPoints[pointIndex + 1];
      
      // Smooth interpolation
      const smoothT = localT * localT * (3 - 2 * localT);
      
      x = centerX + (p1.x + (p2.x - p1.x) * smoothT) * brainWidth;
      y = centerY + (p1.y + (p2.y - p1.y) * smoothT) * brainHeight;
      
    } else if (t < 0.82) {
      // Cerebellum
      const cerebT = (t - 0.7) / 0.12;
      
      // Simple cerebellum shape at bottom back
      const layer = Math.floor(cerebT * 3);
      const layerT = (cerebT * 3) % 1;
      
      x = centerX - brainWidth * 0.3 + layerT * brainWidth * 0.1;
      y = centerY + brainHeight * 0.3 + (layer - 1) * brainHeight * 0.03;
      
    } else if (t < 0.9) {
      // Brain stem
      const stemT = (t - 0.82) / 0.08;
      
      x = centerX - brainWidth * 0.1;
      y = centerY + brainHeight * 0.38 + stemT * brainHeight * 0.12;
      
    } else {
      // Internal folds - simple curved lines
      const internalT = (t - 0.9) / 0.1;
      
      if (internalT < 0.5) {
        const foldT = internalT * 2;
        x = centerX - brainWidth * 0.2 + foldT * brainWidth * 0.3;
        y = centerY - brainHeight * 0.15 + Math.sin(foldT * Math.PI) * brainHeight * 0.05;
      } else {
        const foldT = (internalT - 0.5) * 2;
        x = centerX - brainWidth * 0.15 + foldT * brainWidth * 0.25;
        y = centerY + brainHeight * 0.05 + Math.sin(foldT * Math.PI) * brainHeight * 0.04;
      }
    }
    
    return { x, y };
  }
  
  // Neural network (MLP) formation
  function getNeuralNetworkPosition(index, total, centerX, centerY) {
    const networkWidth = Math.min(canvas.width * 0.8, 240);
    const maxLayerHeight = Math.min(canvas.height * 0.525, 187.5); // 0.7 * 0.75 = 0.525
    
    // Define layer sizes: input (8), hidden1 (16), hidden2 (16), hidden3 (16), output (4)
    const inputSize = 8;
    const hiddenSize = inputSize * 2; // 16
    const outputSize = Math.floor(inputSize * 0.5); // 4
    const layers = [inputSize, hiddenSize, hiddenSize, hiddenSize, outputSize]; // 5 layers total
    const totalNodes = layers.reduce((a, b) => a + b, 0);
    
    // Find which layer this particle belongs to
    let currentIndex = 0;
    let layerIndex = 0;
    let nodeInLayer = 0;
    
    for (let i = 0; i < layers.length; i++) {
      const layerSize = Math.floor(layers[i] * (total / totalNodes));
      if (index < currentIndex + layerSize) {
        layerIndex = i;
        nodeInLayer = index - currentIndex;
        break;
      }
      currentIndex += layerSize;
    }
    
    // Calculate horizontal position (4 layers evenly spaced)
    const x = centerX - networkWidth/2 + layerIndex * (networkWidth / (layers.length - 1));
    
    // Calculate vertical position based on layer size
    const layerSize = Math.floor(layers[layerIndex] * (total / totalNodes));
    const maxLayer = Math.max(...layers);
    const layerHeight = (layers[layerIndex] / maxLayer) * maxLayerHeight;
    
    // Adjusted spacing between nodes for reduced height
    const nodeSpacing = (layerHeight * 1.5) / (layerSize - 1 || 1); // Reduced from 2 to 1.5
    const totalHeight = nodeSpacing * (layerSize - 1);
    const y = centerY - totalHeight/2 + nodeInLayer * nodeSpacing;
    
    return { x, y };
  }
  
  // Store particle trails
  const trails = [];
  const maxTrailLength = 20;
  
  // Particle class
  class Particle {
    constructor(index) {
      // Start particles at random positions
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.randomX = this.x;
      this.randomY = this.y;
      
      // Formation positions (will be calculated dynamically)
      this.targetX = this.x;
      this.targetY = this.y;
      
      // Current position (for smooth transitions)
      this.currentX = this.x;
      this.currentY = this.y;
      
      // Previous position for trails
      this.prevX = this.x;
      this.prevY = this.y;
      
      // Visual properties
      this.radius = particleRadius;
      this.color = particleColor;
      this.opacity = 0.9;
      
      // Physics
      this.vx = 0;
      this.vy = 0;
      
      // For outward diffusion
      this.diffusionStarted = false;
      
      // Trail for this particle
      this.trail = [];
    }
    
    startDiffusion() {
      // Initialize outward velocity from center
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const dx = this.x - centerX;
      const dy = this.y - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy) || 1;
      
      // Set initial velocity outward from center
      const speed = 3 + Math.random() * 2; // Random speed between 3-5
      this.vx = (dx / distance) * speed;
      this.vy = (dy / distance) * speed;
      this.diffusionStarted = true;
    }
    
    updateFormationPosition(index, formationType) {
      const pos = getFormationPosition(index, particleCount, formationType);
      this.targetX = pos.x;
      this.targetY = pos.y;
    }
    
    update(useFormation, speed) {
      // Store previous position
      this.prevX = this.x;
      this.prevY = this.y;
      
      if (useFormation) {
        // Move towards formation
        this.currentX += (this.targetX - this.currentX) * speed;
        this.currentY += (this.targetY - this.currentY) * speed;
      } else {
        // Outward diffusion with physics
        
        // Apply very subtle deceleration
        this.vx *= 0.995;
        this.vy *= 0.995;
        
        // Update position
        this.currentX += this.vx;
        this.currentY += this.vy;
        
        // Edge bouncing with energy loss
        const bounceDamping = 0.7;
        if (this.currentX - this.radius <= 0 && this.vx < 0) {
          this.vx = Math.abs(this.vx) * bounceDamping;
          this.currentX = this.radius;
        } else if (this.currentX + this.radius >= canvas.width && this.vx > 0) {
          this.vx = -Math.abs(this.vx) * bounceDamping;
          this.currentX = canvas.width - this.radius;
        }
        
        if (this.currentY - this.radius <= 0 && this.vy < 0) {
          this.vy = Math.abs(this.vy) * bounceDamping;
          this.currentY = this.radius;
        } else if (this.currentY + this.radius >= canvas.height && this.vy > 0) {
          this.vy = -Math.abs(this.vy) * bounceDamping;
          this.currentY = canvas.height - this.radius;
        }
      }
      
      this.x = this.currentX;
      this.y = this.currentY;
      
      // Add to trail if particle moved significantly
      const dx = this.x - this.prevX;
      const dy = this.y - this.prevY;
      if (Math.sqrt(dx * dx + dy * dy) > 0.5) {
        this.trail.push({ x: this.prevX, y: this.prevY, opacity: 1 });
        if (this.trail.length > maxTrailLength) {
          this.trail.shift();
        }
      }
      
      // Fade trail (slower fade rate)
      this.trail.forEach(point => {
        point.opacity *= 0.975; // Was 0.95, now fades 2x slower
      });
      this.trail = this.trail.filter(point => point.opacity > 0.01);
    }
    
    draw() {
      // Draw smaller Gaussian circles (glow effect)
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3);
      gradient.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
      gradient.addColorStop(0.5, 'rgba(59, 130, 246, 0.1)');
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');
      
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Draw main particle
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
    
    drawTrail() {
      // Draw trail as fading gray lines
      if (this.trail.length > 1) {
        for (let i = 1; i < this.trail.length; i++) {
          const p1 = this.trail[i - 1];
          const p2 = this.trail[i];
          
          ctx.strokeStyle = `rgba(180, 180, 180, ${p2.opacity * 0.3})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        
        // Connect last trail point to current position
        if (this.trail.length > 0) {
          const lastPoint = this.trail[this.trail.length - 1];
          ctx.strokeStyle = `rgba(180, 180, 180, ${lastPoint.opacity * 0.3})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(lastPoint.x, lastPoint.y);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        }
      }
    }
  }
  
  // Initialize particles
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle(i));
  }
  
  // Animation loop
  function animate() {
    // Clear canvas completely for clean rendering
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Update animation phase
    phaseTimer++;
    
    switch(animationPhase) {
      case 0: // Random movement
        if (phaseTimer > 90) { // 1.5 seconds
          animationPhase = 1;
          phaseTimer = 0;
          transitionProgress = 0;
          // Update formation positions
          particles.forEach((particle, index) => {
            particle.updateFormationPosition(index, currentFormation);
          });
        }
        particles.forEach(particle => {
          particle.update(false, 0.02);
        });
        break;
        
      case 1: // Forming
        transitionProgress += 0.015;
        if (transitionProgress >= 1) {
          animationPhase = 2;
          phaseTimer = 0;
          transitionProgress = 1;
        }
        particles.forEach(particle => {
          particle.diffusionStarted = false; // Reset diffusion flag
          particle.update(true, 0.08);
        });
        break;
        
      case 2: // Formed (hold position)
        if (phaseTimer > 90) { // 1.5 seconds
          animationPhase = 3;
          phaseTimer = 0;
          // Start diffusion for all particles
          particles.forEach(particle => particle.startDiffusion());
        }
        particles.forEach(particle => {
          particle.update(true, 0.1);
        });
        break;
        
      case 3: // Dispersing
        transitionProgress -= 0.02;
        if (transitionProgress <= 0) {
          animationPhase = 0;
          phaseTimer = 0;
          transitionProgress = 0;
          // Move to next formation
          currentFormation = (currentFormation + 1) % 3;
        }
        particles.forEach(particle => {
          particle.update(false, 0.03); // Slower speed for smoother dispersal
        });
        break;
    }
    
    // Draw trails first (bottom layer)
    particles.forEach(particle => {
      particle.drawTrail();
    });
    
    // Draw connections (middle layer)
    if ((animationPhase === 1 || animationPhase === 2) && transitionProgress > 0.3) {
      ctx.strokeStyle = `rgba(150, 150, 150, ${0.2 * transitionProgress})`;
      ctx.lineWidth = 0.5;
      
      if (currentFormation === 2) {
        // Neural network connections
        drawNeuralConnections();
      } else {
        // Proximity-based connections for eye and brain
        drawProximityConnections();
      }
    }
    
    // Draw particles on top
    particles.forEach(particle => {
      particle.draw();
    });
    
    requestAnimationFrame(animate);
  }
  
  function drawProximityConnections() {
    // Special connections for brain formation
    if (currentFormation === 1) {
      // Draw specific connections to enhance brain structure
      ctx.strokeStyle = `rgba(120, 120, 120, ${0.3 * transitionProgress})`;
      ctx.lineWidth = 0.8;
      
      // Connect outline points (first 70% of particles)
      const outlineCount = Math.floor(particles.length * 0.7);
      for (let i = 0; i < outlineCount - 1; i++) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[i + 1].x, particles[i + 1].y);
        ctx.stroke();
      }
      // Close the outline
      if (outlineCount > 0) {
        ctx.beginPath();
        ctx.moveTo(particles[outlineCount - 1].x, particles[outlineCount - 1].y);
        ctx.lineTo(particles[0].x, particles[0].y);
        ctx.stroke();
      }
      
      // Connect cerebellum layers with distinctive pattern
      const cerebStart = Math.floor(particles.length * 0.7);
      const cerebEnd = Math.floor(particles.length * 0.82);
      ctx.strokeStyle = `rgba(100, 100, 100, ${0.25 * transitionProgress})`;
      ctx.lineWidth = 0.6;
      
      for (let i = cerebStart; i < cerebEnd - 4; i += 4) {
        // Horizontal ridges for cerebellum
        for (let j = 0; j < 4 && i + j < cerebEnd; j++) {
          if (i + j + 1 < cerebEnd) {
            ctx.beginPath();
            ctx.moveTo(particles[i + j].x, particles[i + j].y);
            ctx.lineTo(particles[i + j + 1].x, particles[i + j + 1].y);
            ctx.stroke();
          }
        }
      }
      
      // Connect brain stem
      const stemStart = Math.floor(particles.length * 0.82);
      const stemEnd = Math.floor(particles.length * 0.9);
      ctx.strokeStyle = `rgba(110, 110, 110, ${0.2 * transitionProgress})`;
      for (let i = stemStart; i < stemEnd - 1; i++) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[i + 1].x, particles[i + 1].y);
        ctx.stroke();
      }
      
      // Draw internal brain folds
      const foldsStart = Math.floor(particles.length * 0.9);
      const foldsEnd = particles.length;
      ctx.strokeStyle = `rgba(90, 90, 90, ${0.15 * transitionProgress})`;
      ctx.lineWidth = 0.8;
      
      // Connect points in each fold
      const foldSize = Math.floor((foldsEnd - foldsStart) / 3);
      for (let fold = 0; fold < 3; fold++) {
        const foldStart = foldsStart + fold * foldSize;
        const foldEnd = Math.min(foldStart + foldSize, foldsEnd);
        
        // Draw each fold as a connected line
        if (foldEnd - foldStart > 1) {
          ctx.beginPath();
          ctx.moveTo(particles[foldStart].x, particles[foldStart].y);
          for (let i = foldStart + 1; i < foldEnd; i++) {
            ctx.lineTo(particles[i].x, particles[i].y);
          }
          ctx.stroke();
        }
      }
      
    } else {
      // Regular proximity connections for other formations
      const connectionDistance = 20;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < Math.min(i + 10, particles.length); j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < connectionDistance) {
            const opacity = (1 - distance / connectionDistance) * 0.3 * transitionProgress;
            ctx.strokeStyle = `rgba(150, 150, 150, ${opacity})`;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }
  }
  
  function drawNeuralConnections() {
    // Neural network connections for 5 layers (input + 3 hidden + output)
    const inputSize = 8;
    const hiddenSize = inputSize * 2; // 16
    const outputSize = Math.floor(inputSize * 0.5); // 4
    const layers = [inputSize, hiddenSize, hiddenSize, hiddenSize, outputSize]; // 5 layers
    const totalNodes = layers.reduce((a, b) => a + b, 0);
    const sparsity = 0.25; // Connection probability
    
    let nodeIndex = 0;
    
    // Set random seed for consistent connections
    let seed = 12345;
    function seededRandom() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }
    
    for (let layer = 0; layer < layers.length - 1; layer++) {
      const currentLayerSize = layers[layer];
      const nextLayerSize = layers[layer + 1];
      const nodesPerLayer = particleCount / totalNodes;
      
      // Connect all nodes between layers with sparsity
      for (let i = 0; i < currentLayerSize * nodesPerLayer; i++) {
        for (let j = 0; j < nextLayerSize * nodesPerLayer; j++) {
          // Only draw connection with probability = sparsity
          if (seededRandom() < sparsity) {
            const p1Index = Math.floor(nodeIndex + i);
            const p2Index = Math.floor(nodeIndex + currentLayerSize * nodesPerLayer + j);
            
            if (p1Index < particles.length && p2Index < particles.length) {
              const p1 = particles[p1Index];
              const p2 = particles[p2Index];
              
              // Even darker gray connections (3x darker than original)
              ctx.strokeStyle = `rgba(60, 60, 60, ${0.4 * transitionProgress})`;
              ctx.lineWidth = 0.1;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
      }
      nodeIndex += currentLayerSize * nodesPerLayer;
    }
  }
  
  animate();
})();
</script>
