<div class="news-container" style="padding-top: 20px;">
  <h1 class="news-header" style="text-align: center; margin-bottom: 30px;">All News</h1>
  <div class="news-list" style="max-height: none; overflow-y: visible;">
    {% for article in site.data.news %}
    <div class="news-item">
      <div class="news-date">{{ article.date }}</div>
      <div class="news-content">{{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}</div>
    </div>
    {% endfor %}
  </div>
</div>
