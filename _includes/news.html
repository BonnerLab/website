<div class="news-container">
    <h4 class="news-header">Latest News</h4>
    <div class="news-list">
        {% for article in site.data.news limit:12 %}
        <div class="news-item">
            <div class="news-date">{{ article.date }}</div>
            <div class="news-content">{{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}</div>
        </div>
        {% endfor %}
    </div>
    <div class="news-footer">
        <a href="{{ site.url }}{{ site.baseurl }}/allnews.html">View all news →</a>
    </div>
</div>
