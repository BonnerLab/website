<!doctype html><meta charset="utf-8">
<!-- Teaser clip template for bonnerlab.org. Copy this folder to _teasers/<name>/ and fill in the scene.
     The page is 640x448 and must define window.DURATION (seconds, 7 to 10) and a pure, synchronous
     window.renderAt(t): the frame for time t depends on t alone (no wall clock, no Math.random; use rng(seed)).
     Render:  FFMPEG=_teasers/bin/ffmpeg python3 _teasers/render.py _teasers/<name> images/pubvid/<name>
     Stills:  ... same command ... --still 0 2 4.5 8   (writes _teasers/<name>/still_<t>.png, no video) -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fbfbf9}
svg{display:block;font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif}
.serif{font-family:"Source Serif 4",Georgia,serif}
</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <!-- Headline: Source Serif 4, 27px, weight 500, ink; baseline y=72, left edge x=36; at most one line,
       exactly one key word or phrase in an accent colour. -->
  <text class="serif" x="36" y="72" font-size="27" font-weight="500" fill="#17202a">Headline with one <tspan fill="#b45f06">accent</tspan> word</text>
  <g id="stat"></g><!-- things drawn once -->
  <g id="dyn"></g><!-- cleared and redrawn every frame -->
</svg>
<script>
(function(){
/* Palette (the site's own, plus two semantic colours). Colour carries meaning: pick a role per colour and keep it. */
var C={paper:'#fbfbf9', wash:'#f2f3f0', panel:'#ffffff', hair:'#e3e5e8', hairStrong:'#cfd3d8',
       ink:'#17202a', inkSoft:'#3d4653', slate:'#66707d',
       blue:'#1f4f9a', blueDeep:'#143a75', amber:'#b45f06', orange:'#d9822b', green:'#2f8f6b', red:'#c2413b', violet:'#6b4fa0'};
var RGB={paper:[251,251,249], wash:[242,243,240], hair:[227,229,232], ink:[23,32,42], slate:[102,112,125],
         blue:[31,79,154], amber:[180,95,6], orange:[217,130,43], green:[47,143,107], red:[194,65,59], violet:[107,79,160]};
/* Type: labels 15 to 21px Source Sans 3 (never below 14px: the clip is shown at roughly 0.6 to 0.8 scale);
   numbers and equations in Source Serif 4. Strokes 1.5 to 3px. Keep everything inside x 28..612, y 28..420. */

var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(s,a,p){var e=el('text',a,p);e.textContent=s;return e}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}            /* 0..1 progress of t through the window [a,b] */
function lerp(a,b,k){return a+(b-a)*k}
function mix(c1,c2,k){var o=[];for(var i=0;i<3;i++)o.push(Math.round(c1[i]+(c2[i]-c1[i])*k));return 'rgb('+o+')'}

var dyn=document.getElementById('dyn');

window.DURATION=9;
window.renderAt=function(t){
  while(dyn.firstChild)dyn.removeChild(dyn.firstChild);
  /* draw the whole frame for time t here, using seg(t,a,b) phase windows */
  var k=ease(seg(t,.6,1.6));
  el('circle',{cx:lerp(120,520,k),cy:240,r:14,fill:C.blue},dyn);
};
window.renderAt(0);
})();
</script>
