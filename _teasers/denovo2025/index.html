<!doctype html><meta charset="utf-8">
<!-- Teaser clip: "Convolutional architectures are cortex-aligned de novo" (Kazemian, Elmoznino & Bonner, 2025).
     One idea: an untrained convolutional network (random filters, spatial compression + feature expansion)
     predicts monkey visual cortex better and better as its last layer is widened, approaching pre-trained AlexNet,
     while untrained transformer and fully connected networks gain little (schematic of Fig. 2b).
     Render:  FFMPEG=_teasers/bin/ffmpeg python3 _teasers/render.py _teasers/denovo2025 images/pubvid/denovo2025 -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fbfbf9}
svg{display:block;font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif}
.serif{font-family:"Source Serif 4",Georgia,serif}
</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <text class="serif" x="36" y="72" font-size="27" font-weight="500" fill="#17202a">An <tspan fill="#b45f06">untrained</tspan> CNN predicts visual cortex</text>
  <g id="stat"></g><!-- things drawn once -->
  <g id="dyn"></g><!-- cleared and redrawn every frame -->
</svg>
<script>
(function(){
var C={paper:'#fbfbf9', wash:'#f2f3f0', panel:'#ffffff', hair:'#e3e5e8', hairStrong:'#cfd3d8',
       ink:'#17202a', inkSoft:'#3d4653', slate:'#66707d',
       blue:'#1f4f9a', blueDeep:'#143a75', amber:'#b45f06', orange:'#d9822b', green:'#2f8f6b', red:'#c2413b', violet:'#6b4fa0'};
var RGB={paper:[251,251,249], wash:[242,243,240], hair:[227,229,232], ink:[23,32,42], inkSoft:[61,70,83], slate:[102,112,125],
         blue:[31,79,154], amber:[180,95,6], orange:[217,130,43], green:[47,143,107], red:[194,65,59], violet:[107,79,160]};

var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(s,a,p){var e=el('text',a,p);e.textContent=s;return e}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function soft(x){x=cl(x);return x*x*(3-2*x)}
function seg(t,a,b){return cl((t-a)/(b-a))}
function lerp(a,b,k){return a+(b-a)*k}
function mix(c1,c2,k){var o=[];for(var i=0;i<3;i++)o.push(Math.round(c1[i]+(c2[i]-c1[i])*k));return 'rgb('+o+')'}
function f1(x){return x.toFixed(1)}

var stat=document.getElementById('stat'), dyn=document.getElementById('dyn');

/* ---------------- network (left) ----------------
   Five layers. Face height = spatial size (shrinks: pooling); block length = number of channels (grows).
   Layers 2-5 hold random filters (random-toned channel slices); only the length of layer 5 is manipulated. */
var CY=238, DF=.17, DY=.62, GAP=6, PITCH=4.6;
var LH=[128,98,74,54,38], LW=[8,18,28,37,0], W5A=14, W5B=101;
var LX=[], x=38;
for(var i=0;i<5;i++){ LX.push(x); x+=LW[i]+LH[i]*DF+GAP }
/* random tone per channel slice, fixed for the whole clip (the weights never change) */
var TONE=[]; (function(){ for(var i=0;i<5;i++){ var R=rng(7001+i*97), a=[]; for(var j=0;j<40;j++) a.push(.16+.62*R()); TONE.push(a) } })();

function cuboid(g,i,w){
  var h=LH[i], x0=LX[i], y0=CY-h/2, dx=h*DF, dy=-h*DF*DY, n, p, j;
  if(i===0){ n=1; p=w } else if(i===4){ p=PITCH; n=Math.ceil(w/p-1e-6) } else { n=Math.round(w/PITCH); p=w/n }
  for(j=0;j<n;j++){
    var a=x0+j*p, b=Math.min(x0+w,a+p)+.35, k=i===0?.30:TONE[i][j];
    el('rect',{x:f1(a),y:f1(y0),width:f1(b-a),height:h,fill:mix(RGB.paper,RGB.amber,k)},g);
    el('polygon',{points:f1(a)+','+f1(y0)+' '+f1(a+dx)+','+f1(y0+dy)+' '+f1(b+dx)+','+f1(y0+dy)+' '+f1(b)+','+f1(y0),
       fill:mix(RGB.paper,RGB.amber,k*.55)},g);
  }
  var xr=x0+w;
  el('polygon',{points:f1(xr)+','+f1(y0)+' '+f1(xr+dx)+','+f1(y0+dy)+' '+f1(xr+dx)+','+f1(y0+dy+h)+' '+f1(xr)+','+f1(y0+h),
     fill:mix(RGB.paper,RGB.amber,.62)},g);
  el('path',{d:'M'+f1(x0)+' '+f1(y0)+' H'+f1(xr)+' V'+f1(y0+h)+' H'+f1(x0)+' Z M'+f1(x0)+' '+f1(y0)+' L'+f1(x0+dx)+' '+f1(y0+dy)+' H'+f1(xr+dx)+' V'+f1(y0+dy+h)+' L'+f1(xr)+' '+f1(y0+h)+' M'+f1(xr)+' '+f1(y0)+' L'+f1(xr+dx)+' '+f1(y0+dy),
     fill:'none',stroke:C.amber,'stroke-width':1.5,'stroke-linejoin':'round','stroke-linecap':'round'},g);
}
for(var i=0;i<4;i++) cuboid(stat,i,LW[i]);

/* "random filters": a small noise patch + label, bracketing layers 2-5 */
var BRY=146, BRX=LX[1]-1;
(function(){ var R=rng(4242), s=5.5, x0=BRX+1, y0=BRY-34;
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){ var v=Math.round(40+200*R()); el('rect',{x:x0+c*s,y:y0+r*s,width:s+.3,height:s+.3,fill:'rgb('+v+','+v+','+v+')'},stat) }
  el('rect',{x:x0,y:y0,width:4*s,height:4*s,fill:'none',stroke:C.inkSoft,'stroke-width':1.5},stat);
  txt('random filters',{x:x0+4*s+9,y:BRY-17,'font-size':17,'font-weight':500,fill:C.ink},stat);
})();

/* legend rows under the network: the two manipulations of dimensionality */
var LGX=40, LG1=350, LG2=380;
el('polygon',{points:LGX+','+(LG1-15)+' '+(LGX+34)+','+(LG1-2)+' '+(LGX+34)+','+(LG1+1)+' '+LGX+','+(LG1+1),fill:C.slate},stat);
txt('spatial compression',{x:LGX+46,y:LG1,'font-size':17,fill:C.inkSoft},stat);

/* ---------------- plot (right): schematic of Fig. 2b ---------------- */
var PX0=384, PX1=600, PY0=386, PY1=116;
function px(lx){return 398+(lx-2)*46}             /* log10(number of features) 2..6 */
function py(v){return PY0-v*400}                  /* encoding score, 0 at the axis */
var CONV=[[2,.32],[3,.425],[4,.515],[5,.553],[6,.565]];
var TRAN=[[3.37,.28],[4.07,.338],[5.07,.352],[6.07,.355]];
var FULL=[[2,.185],[3,.213],[4,.25],[5,.243],[6,.238]];
var ALEX=.60;
/* axes with arrowheads, no ticks, no numbers */
el('path',{d:'M'+PX0+' '+(PY1+4)+' V'+PY0+' H'+(PX1-2),fill:'none',stroke:C.inkSoft,'stroke-width':1.5,'stroke-linejoin':'round'},stat);
el('polygon',{points:(PX0-5)+','+(PY1+6)+' '+PX0+','+(PY1-4)+' '+(PX0+5)+','+(PY1+6),fill:C.inkSoft},stat);
el('polygon',{points:(PX1-4)+','+(PY0-5)+' '+(PX1+6)+','+PY0+' '+(PX1-4)+','+(PY0+5),fill:C.inkSoft},stat);
(function(){ var t=el('text',{x:366,y:(PY0+PY1)/2+4,'font-size':16,'text-anchor':'middle',fill:C.inkSoft,transform:'rotate(-90 366 '+((PY0+PY1)/2+4)+')'},stat);
  var a=el('tspan',{},t); a.textContent='predicts ';
  var b=el('tspan',{fill:C.blue,'font-weight':600},t); b.textContent='monkey visual cortex'; })();

function along(P,lx){ /* piecewise-linear value at lx */
  for(var i=0;i<P.length-1;i++){ if(lx<=P[i+1][0]){ var k=(lx-P[i][0])/(P[i+1][0]-P[i][0]); return lerp(P[i][1],P[i+1][1],cl(k)) } }
  return P[P.length-1][1] }
function curve(g,P,k,col,w,dotR){ /* draw P from its start up to fraction k of its x-extent; returns head position */
  var a=P[0][0], b=P[P.length-1][0], lx=lerp(a,b,k), pts=[], i;
  for(i=0;i<P.length;i++) if(P[i][0]<lx-1e-6) pts.push([px(P[i][0]),py(P[i][1])]);
  var head=[px(lx),py(along(P,lx))]; pts.push(head);
  if(pts.length>1) el('polyline',{points:pts.map(function(p){return f1(p[0])+','+f1(p[1])}).join(' '),fill:'none',stroke:col,'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round'},g);
  for(i=0;i<P.length;i++) if(P[i][0]<=lx+1e-6) el('circle',{cx:f1(px(P[i][0])),cy:f1(py(P[i][1])),r:dotR,fill:col},g);
  return head }

window.DURATION=9;
window.renderAt=function(t){
  while(dyn.firstChild)dyn.removeChild(dyn.firstChild);

  /* phases */
  var kA=1, kAl=1;                                              /* pre-trained AlexNet reference line: there from the start */
  var kE=ease(seg(t,1.0,4.6));                                  /* feature expansion of layer 5 + conv curve */
  var kEc=soft(seg(t,1.0,1.7)), kCl=soft(seg(t,4.2,4.9));
  var kO=ease(seg(t,5.3,6.5)), kOl=soft(seg(t,6.2,6.8));        /* other untrained architectures */
  var kR=ease(seg(t,7.1,7.7));                                  /* final emphasis */

  /* --- network: layer 5 widens, nothing else changes --- */
  var w5=lerp(W5A,W5B,kE);
  cuboid(dyn,4,w5);
  var bx1=LX[4]+w5+LH[4]*DF+1;
  el('path',{d:'M'+f1(BRX)+' '+(BRY+7)+' V'+BRY+' H'+f1(bx1)+' V'+(BRY+7),fill:'none',stroke:C.slate,'stroke-width':1.5,'stroke-linejoin':'round','stroke-linecap':'round'},dyn);
  var fcol=mix(RGB.slate,RGB.amber,kEc), tcol=mix(RGB.inkSoft,RGB.amber,kEc);
  el('polygon',{points:LGX+','+(LG2-2)+' '+(LGX+34)+','+(LG2-15)+' '+(LGX+34)+','+(LG2+1)+' '+LGX+','+(LG2+1),fill:fcol},dyn);
  txt('feature expansion',{x:LGX+46,y:LG2,'font-size':17,'font-weight':500,fill:tcol},dyn);

  /* --- plot --- */
  var ya=py(ALEX);
  if(kA>0) el('line',{x1:PX0+1,y1:ya,x2:f1(lerp(PX0+1,PX1-8,kA)),y2:ya,stroke:C.ink,'stroke-width':2,'stroke-dasharray':'7 5'},dyn);
  if(kAl>0) txt('pre-trained AlexNet',{x:PX1-8,y:ya-9,'font-size':16,'text-anchor':'end',fill:C.ink,opacity:kAl},dyn);

  if(kO>0){
    curve(dyn,FULL,kO,C.slate,2.5,3.2);
    curve(dyn,TRAN,kO,C.slate,2.5,3.2);
  }
  if(kOl>0){
    txt('transformer',{x:PX1-8,y:py(.355)+25,'font-size':16,'text-anchor':'end',fill:C.slate,opacity:kOl},dyn);
    txt('fully connected',{x:PX1-8,y:py(.238)+25,'font-size':16,'text-anchor':'end',fill:C.slate,opacity:kOl},dyn);
  }

  var head=curve(dyn,CONV,kE,C.amber,3,3.6);
  if(kR>0) el('circle',{cx:f1(head[0]),cy:f1(head[1]),r:f1(7+3.2*kR),fill:'none',stroke:C.amber,'stroke-width':1.8,opacity:kR},dyn);
  el('circle',{cx:f1(head[0]),cy:f1(head[1]),r:6.5,fill:C.amber,stroke:C.paper,'stroke-width':2},dyn);
  if(kCl>0) txt('convolutional',{x:PX1-8,y:py(.565)+40,'font-size':17,'font-weight':600,'text-anchor':'end',fill:C.amber,opacity:kCl},dyn);

  /* x-axis label links the axis to layer 5 */
  txt('random features',{x:(PX0+PX1)/2,y:PY0+24,'font-size':16,'text-anchor':'middle',fill:tcol},dyn);
};
window.renderAt(0);
})();
</script>
