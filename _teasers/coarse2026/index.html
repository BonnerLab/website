<!doctype html><meta charset="utf-8">
<!-- Teaser clip for bonnerlab.org, built from _teasers/_template.
     Paper: "Extremely coarse learning objectives induce human-aligned representations in AI vision models"
     (Mehta & Bonner, arXiv:2605.05556).
     Render:  FFMPEG=_teasers/bin/ffmpeg python3 _teasers/render.py _teasers/coarse2026 images/pubvid/coarse2026
     Stills:  ... same command ... --still 0 1.5 3 4.5 6 7.5 9 -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fbfbf9}
svg{display:block;font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif}
.serif{font-family:"Source Serif 4",Georgia,serif}
.halo{paint-order:stroke;stroke:#fbfbf9;stroke-width:5px;stroke-linejoin:round}
</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <text class="serif" x="36" y="72" font-size="27" font-weight="500" fill="#17202a"><tspan fill="#b45f06">Coarse</tspan> labels, more human-like vision</text>
  <g id="stat"></g><!-- things drawn once -->
  <g id="dyn"></g><!-- cleared and redrawn every frame -->
</svg>
<script>
/* Left: how the coarse labels are built (paper Fig. 1a and section 2). Image embeddings are split at the
   median of principal component 1, then 2, then 3; an image's label is its pattern of signs, so the 1,000
   original classes become 2, 4, 8.
   Right: what training on them gives (paper Fig. 4a; same result as Fig. 3b). RSA (Spearman) with the THINGS
   human similarity judgments is 0.581 for the network trained on 8 classes and 0.367 for the same network
   trained on 1,000 classes. Those two values are the only data on screen; the point cloud is synthetic (seeded).
   Bottom line: abstract and Fig. 2, 8-class networks "match or exceed" 1,000-class ones in visual cortex. */
(function(){
var C={paper:'#fbfbf9', wash:'#f2f3f0', panel:'#ffffff', hair:'#e3e5e8', hairStrong:'#cfd3d8',
       ink:'#17202a', inkSoft:'#3d4653', slate:'#66707d',
       blue:'#1f4f9a', blueDeep:'#143a75', amber:'#b45f06', orange:'#d9822b', green:'#2f8f6b', red:'#c2413b', violet:'#6b4fa0'};
var RGB={paper:[251,251,249], wash:[242,243,240], hair:[227,229,232], ink:[23,32,42], slate:[102,112,125],
         blue:[31,79,154], amber:[180,95,6], orange:[217,130,43], green:[47,143,107], red:[194,65,59], violet:[107,79,160]};
/* Colour roles: amber = coarse (8-class) training; grey = 1,000-class training;
   green / violet / blue / red (and their light and dark shades) = the coarse classes in the cloud;
   amber and orange are kept out of the cloud so that no single class looks tied to the 8-class bar. */

var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(s,a,p){var e=el('text',a,p);e.textContent=s;return e}
function span(s,a,p){var e=el('tspan',a,p);e.textContent=s;return e}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function smooth(x){x=cl(x);return x*x*(3-2*x)}
function easeOut(x){x=cl(x);return 1-Math.pow(1-x,3)}
function seg(t,a,b){return cl((t-a)/(b-a))}            /* 0..1 progress of t through the window [a,b] */
function lerp(a,b,k){return a+(b-a)*k}
function mix3(a,b,k){return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}
function css(c){return'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'}
function shade(c,f){return c.map(function(v){return f>0?v+(255-v)*f:v*(1+f)})}

var SERIF='"Source Serif 4",Georgia,serif';
var GREEN=RGB.green,VIOLET=RGB.violet,RED=RGB.red,BLUE=RGB.blue;
/* the 1,000 original classes: many unrelated hues (palette colours and tints of them) */
var MANY=[RGB.green,[122,190,160],RGB.orange,[228,172,112],RGB.red,[218,128,122],RGB.blue,[112,152,206],
          RGB.violet,[166,146,200],RGB.slate,[150,158,60]];
var BAR8=C.amber,BAR1K='#a4abb5';

/* ── synthetic embedding cloud: a few clumps, widest along x, then y, then z ── */
var R=rng(20260507);
function gauss(){var u=0;for(var i=0;i<6;i++)u+=R();return(u-3)/0.7071}
var cents=[],pts=[],NP=380,wsum=0;
[-1.38,-0.46,0.46,1.38].forEach(function(gx){[-0.68,0,0.68].forEach(function(gy){
  var w=0.55+R();wsum+=w;
  cents.push([gx+(R()-0.5)*0.5,gy+(R()-0.5)*0.36,gauss()*0.42,w]);
})});
function pick(){var u=R()*wsum;for(var i=0;i<cents.length;i++){u-=cents[i][3];if(u<=0)return cents[i]}return cents[0]}
while(pts.length<NP){
  var c=pick(),x=c[0]+gauss()*0.36,y=c[1]+gauss()*0.27,z=c[2]+gauss()*0.3;
  if(Math.abs(x)>1.95||Math.abs(y)>1.3||Math.abs(z)>1.05)continue;
  pts.push({x:x,y:y,z:z,many:MANY[Math.floor(R()*MANY.length)]});
}
/* median-centre each axis, so every split is an exact half; trim stragglers and centre again */
var BOX={x:1.9,y:1.4,z:1.15};
for(var pass=0;pass<4;pass++){
  ['x','y','z'].forEach(function(a){
    var v=pts.map(function(p){return p[a]}).sort(function(p,q){return p-q}),n=v.length,m=n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2;
    pts.forEach(function(p){p[a]-=m});
  });
  if(pass<3){pts=pts.filter(function(p){var u=p.x/BOX.x,v=p.y/BOX.y,w=p.z/BOX.z;return u*u+v*v+w*w<=1});if(pts.length%2)pts.pop()}
}
pts.forEach(function(p){
  var bx=p.x>=0,by=p.y>=0,bz=p.z>=0,quad=bx?(by?RED:VIOLET):(by?BLUE:GREEN);
  p.c=[p.many,bx?VIOLET:GREEN,quad,shade(quad,bz?-0.26:0.5)];
});

/* ── layout ── */
var CX=154,CY=236,S=59;                       // cloud centre and px per unit
var AX=[{L:1.98,name:'PC 1'},{L:1.6,name:'PC 2'},{L:1.5,name:'PC 3'}];
var YAW=-0.72,PITCH=0.3;
var BASE=326,SC=250,BW=78,B8=412,B1K=538;     // chart: baseline y, px per unit RSA, bar width, bar centres
var CHX=(B8+B1K)/2;                           // chart centre x
var V8=0.581,V1K=0.367;                       // paper Fig. 4a: bootstrap mean RSA with the behavioural RDM

/* ── timeline (s) ── */
var T1=0.7,T2=2.0,T3=3.3,SWEEP=0.85;          // the three splits; T3 starts with the tilt
var T3A=T3+0.75;                              // PC 3 axis starts drawing
var TT=5.0,TB1=5.6,TB8=6.3,TC=7.3;            // train arrow, 1,000 bar, 8 bar, cortex line

var dyn=document.getElementById('dyn');

function arrow(g,x0,y0,x1,y1,col,w,op,head){
  var dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);if(len<2||op<=0.01)return;
  dx/=len;dy/=len;var h=Math.min(head,len*0.6),bx=x1-dx*h,by=y1-dy*h,nx=-dy*h*0.5,ny=dx*h*0.5;
  el('line',{x1:x0,y1:y0,x2:bx,y2:by,stroke:col,'stroke-width':w,'stroke-linecap':'round',opacity:op},g);
  el('polygon',{points:x1+','+y1+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny),fill:col,opacity:op},g);
}
/* "<number> classes": number in serif ink, word in sans grey */
function classes(g,num,x,y,size,op){
  var tx=el('text',{x:x,y:y,'text-anchor':'middle','font-size':size,opacity:op},g);
  span(num,{'font-family':SERIF,'font-weight':600,fill:C.ink},tx);
  span(' classes',{'font-weight':500,fill:C.inkSoft},tx);
}

window.DURATION=9;
window.renderAt=function(t){
  while(dyn.firstChild)dyn.removeChild(dyn.firstChild);

  /* camera: face-on for the first two splits, then tilts to show depth */
  var tilt=smooth(seg(t,T3,T3+1.1)),yaw=YAW*tilt,pitch=PITCH*tilt;
  var cy_=Math.cos(yaw),sy_=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  function proj(x,y,z){var x1=x*cy_+z*sy_,z1=-x*sy_+z*cy_,y1=y*cp-z1*sp;return[CX+x1*S,CY-y1*S,y*sp+z1*cp]}

  /* each axis is drawn tail to tip; points take their new colour as the tip passes them */
  var starts=[T1,T2,T3A],head=[],a,i;
  for(a=0;a<3;a++)head.push(-AX[a].L+2*AX[a].L*smooth(seg(t,starts[a],starts[a]+SWEEP)));

  /* dots, far to near */
  var list=[];
  for(i=0;i<pts.length;i++){
    var p=pts[i],co=[p.x,p.y,p.z],col=p.c[0];
    for(a=0;a<3;a++)col=mix3(col,p.c[a+1],smooth((head[a]-co[a])/0.34));
    var q=proj(p.x,p.y,p.z);list.push([q[0],q[1],q[2],col]);
  }
  list.sort(function(u,v){return u[2]-v[2]});
  var gd=el('g',{opacity:0.92},dyn);
  for(i=0;i<list.length;i++){
    var d=list[i],near=cl((d[2]+1.3)/2.6);
    el('circle',{cx:d[0].toFixed(2),cy:d[1].toFixed(2),r:(3.4*(1+0.22*tilt*(near-0.5))).toFixed(2),fill:css(d[3])},gd);
  }

  /* axes and their labels */
  for(a=0;a<3;a++){
    var L=AX[a].L,pr=seg(t,starts[a],starts[a]+SWEEP);if(pr<=0)continue;
    var v0=[0,0,0],v1=[0,0,0],vL=[0,0,0];v0[a]=-L;v1[a]=head[a];vL[a]=L;
    var p0=proj(v0[0],v0[1],v0[2]),p1=proj(v1[0],v1[1],v1[2]),pL=proj(vL[0],vL[1],vL[2]);
    arrow(dyn,p0[0],p0[1],p1[0],p1[1],C.ink,2.4,cl(pr*8),10);
    var lo=smooth(seg(t,starts[a]+SWEEP-0.25,starts[a]+SWEEP+0.2));
    if(lo>0){
      var at=a===0?{x:pL[0]+7,y:pL[1]+6,anchor:'start'}:a===1?{x:pL[0]+9,y:pL[1]+11,anchor:'start'}:{x:pL[0]-7,y:pL[1]+15,anchor:'end'};
      txt(AX[a].name,{x:at.x,y:at.y,'text-anchor':at.anchor,'font-size':17,'font-weight':500,fill:C.inkSoft,opacity:lo,'class':'halo'},dyn);
    }
  }

  /* class counter under the cloud: 1,000 -> 2 -> 4 -> 8 */
  var COUNTS=['1,000','2','4','8'],when=[T1+0.45,T2+0.45,T3A+0.45],stage=0,k;
  for(k=0;k<3;k++)if(t>=when[k])stage=k+1;
  var fo=stage===0?1:smooth(seg(t,when[stage-1],when[stage-1]+0.3));
  if(stage<3&&t>=when[stage]-0.22)classes(dyn,COUNTS[stage],CX,388,22,1-smooth(seg(t,when[stage]-0.22,when[stage])));
  else classes(dyn,COUNTS[stage],CX,388+(1-fo)*5,22,fo);

  /* train arrow */
  var tr=smooth(seg(t,TT,TT+0.55));
  if(tr>0){
    arrow(dyn,296,CY,296+44*tr,CY,C.slate,2.4,cl(tr*6),10);
    txt('train',{x:318,y:CY-13,'text-anchor':'middle','font-size':17,'font-weight':500,fill:C.inkSoft,opacity:smooth(seg(t,TT+0.2,TT+0.6))},dyn);
  }

  /* chart: match to human similarity judgments */
  var on=0.6+0.4*smooth(seg(t,TT+0.2,TT+0.9));
  var g=el('g',{opacity:on},dyn);
  txt('match to human judgments',{x:CHX,y:118,'text-anchor':'middle','font-size':19,'font-weight':500,fill:C.inkSoft},g);
  txt('RSA (Spearman ρ)',{x:CHX,y:139,'text-anchor':'middle','font-size':15,fill:C.slate},g);
  el('line',{x1:358,y1:BASE,x2:592,y2:BASE,stroke:C.hairStrong,'stroke-width':2,'stroke-linecap':'round'},g);
  classes(g,'8',B8,BASE+25,17,1);
  classes(g,'1,000',B1K,BASE+25,17,1);
  function bar(xc,val,pr,col,lab,lo){
    var h=val*SC*pr;if(h<0.5)return;
    var r=Math.min(6,h),x=xc-BW/2,y=BASE-h;
    el('path',{d:'M'+x+','+BASE+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+BW-r)+'Q'+(x+BW)+','+y+' '+(x+BW)+','+(y+r)+'V'+BASE+'Z',fill:col},dyn);
    if(lo>0)txt(lab,{x:xc,y:y-10,'text-anchor':'middle','font-family':SERIF,'font-size':21,'font-weight':600,fill:C.ink,opacity:lo},dyn);
  }
  bar(B1K,V1K,easeOut(seg(t,TB1,TB1+0.8)),BAR1K,'0.367',smooth(seg(t,TB1+0.55,TB1+0.9)));
  bar(B8,V8,easeOut(seg(t,TB8,TB8+1.0)),BAR8,'0.581',smooth(seg(t,TB8+0.75,TB8+1.1)));

  /* the neural result, in words: 8-class networks match or exceed 1,000-class ones in visual cortex */
  var co_=smooth(seg(t,TC,TC+0.6));
  if(co_>0)txt('visual cortex: on par or better',{x:CHX,y:BASE+62,'text-anchor':'middle','font-size':17,'font-weight':500,fill:C.inkSoft,opacity:co_},dyn);
};
window.renderAt(0);
})();
</script>
