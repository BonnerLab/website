<!doctype html><meta charset="utf-8">
<!-- Teaser clip: Elmoznino & Bonner (2024), PLOS Comput Biol. "High-performing neural network models of visual
     cortex benefit from high latent dimensionality".
     One idea: across many DNN layers, higher effective dimensionality (log axis) goes with better prediction of
     visual cortex (Fig 3a). The two point clouds follow Fig 1a (low vs high ED).
     All points are synthetic and no numbers are shown.
     Render:  FFMPEG=_teasers/bin/ffmpeg python3 _teasers/render.py _teasers/dimensionality2024 images/pubvid/dimensionality2024 -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fbfbf9}
svg{display:block;font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif}
.serif{font-family:"Source Serif 4",Georgia,serif}
</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <text class="serif" x="36" y="72" font-size="27" font-weight="500" fill="#17202a">Better brain models are <tspan fill="#b45f06">high-dimensional</tspan></text>
  <g id="stat"></g><!-- things drawn once -->
  <g id="dyn"></g><!-- cleared and redrawn every frame -->
</svg>
<script>
(function(){
/* Palette. Roles here: amber = the models (DNN representations and their dots), blue = the brain (cortex axis),
   ink = the trend, slate/hair = scaffolding. */
var C={paper:'#fbfbf9', wash:'#f2f3f0', panel:'#ffffff', hair:'#e3e5e8', hairStrong:'#cfd3d8',
       ink:'#17202a', inkSoft:'#3d4653', slate:'#66707d',
       blue:'#1f4f9a', blueDeep:'#143a75', amber:'#b45f06', orange:'#d9822b', green:'#2f8f6b', red:'#c2413b', violet:'#6b4fa0'};

var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(s,a,p){var e=el('text',a,p);e.textContent=s;return e}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}
function lerp(a,b,k){return a+(b-a)*k}

var stat=document.getElementById('stat'), dyn=document.getElementById('dyn');

/* ---------- layout ---------- */
var X0=84, X1=600, YB=290, YT=104;                 /* plot frame */
function PX(u){return X0+18+u*468}                 /* u: position along log(effective dimensionality), 0..1 */
function PY(v){return YB-12-v*156}                 /* v: encoding performance, 0..1 (schematic units) */
var CY=350, CR=42;                                 /* point clouds under the x-axis */
var EXL={u:.07,v:.21}, EXH={u:.9,v:.83};           /* the two example layers */
var CXL=PX(EXL.u), CXH=PX(EXH.u);

/* ---------- synthetic scatter (schematic; shaped like Fig 3a: rising, roughly linear on a log x-axis) ---------- */
var R=rng(20245), PTS=[];
function gauss(){return (R()+R()+R()+R()-2)*1.732}
for(var i=0;i<118;i++){
  var u=.02+.96*Math.pow(R(),1.9), v=.25+.62*u+gauss()*.14*(1-.45*u);
  if(u<.07)v-=R()*.2; if(u>.84)v-=.5*(u-.84);
  PTS.push({u:u,v:Math.min(.97,Math.max(.03,v))});
}
/* least-squares line through all drawn points, so the line is the honest fit of what is on screen */
var ALL=PTS.concat([EXL,EXH]), n=ALL.length, mu=0, mv=0, suu=0, suv=0;
ALL.forEach(function(p){mu+=p.u;mv+=p.v}); mu/=n; mv/=n;
ALL.forEach(function(p){suu+=(p.u-mu)*(p.u-mu);suv+=(p.u-mu)*(p.v-mv)});
var SLOPE=suv/suu, ICPT=mv-SLOPE*mu;

/* ---------- point clouds (after Fig 1a): the same number of points, on a line vs filling a volume ---------- */
var NP=72, D=[.9,.4,.15], dl=Math.hypot(D[0],D[1],D[2]); D=D.map(function(x){return x/dl});
function linePts(seed){var r=rng(seed),o=[];function g(){return (r()+r()+r()+r()-2)*1.732}
  for(var i=0;i<NP;i++){var s=Math.max(-1.05,Math.min(1.05,g()*.5));o.push([D[0]*s+g()*.045,D[1]*s+g()*.045,D[2]*s+g()*.045])}return o}
function ballPts(seed){var r=rng(seed),o=[];function g(){return (r()+r()+r()+r()-2)*1.732}
  for(var i=0;i<NP;i++){var x=g(),y=g(),z=g(),l=Math.hypot(x,y,z)||1,rad=Math.cbrt(r())*.98;o.push([x/l*rad,y/l*rad,z/l*rad])}return o}
var LOW=linePts(11), HI0=linePts(29), HI1=ballPts(47);
var TILT=.36, ct=Math.cos(TILT), st=Math.sin(TILT);
function proj(p,th,cx){var c=Math.cos(th),s=Math.sin(th), x=p[0]*c+p[2]*s, z=-p[0]*s+p[2]*c, y=p[1]*ct-z*st, d=p[1]*st+z*ct;
  return [cx+CR*x, CY-CR*y, d]}
function cloud(g,pts,th,cx,op){
  if(op<=.01)return; var G=el('g',{opacity:op},g);
  [[1,0,0],[0,1,0],[0,0,1]].forEach(function(a){var L=1.0, p=proj([a[0]*L,a[1]*L,a[2]*L],th,cx), q=proj([-a[0]*L,-a[1]*L,-a[2]*L],th,cx);
    el('line',{x1:q[0],y1:q[1],x2:p[0],y2:p[1],stroke:C.hairStrong,'stroke-width':1.5,'stroke-linecap':'round'},G)});
  pts.map(function(p){return proj(p,th,cx)}).sort(function(a,b){return a[2]-b[2]}).forEach(function(p){
    var k=cl((p[2]+1)/2); el('circle',{cx:p[0].toFixed(2),cy:p[1].toFixed(2),r:(2+.9*k).toFixed(2),fill:C.amber,opacity:(.42+.4*k).toFixed(2)},G)});
}

/* ---------- static scaffolding ---------- */
el('path',{d:'M '+X0+' '+(YT+4)+' V '+YB+' H '+(X1-4),fill:'none',stroke:C.slate,'stroke-width':1.5,'stroke-linecap':'round','stroke-linejoin':'round'},stat);
el('path',{d:'M '+(X0-4.5)+' '+(YT+7)+' L '+X0+' '+(YT-2)+' L '+(X0+4.5)+' '+(YT+7)+' Z',fill:C.slate},stat);
el('path',{d:'M '+(X1-7)+' '+(YB-4.5)+' L '+(X1+2)+' '+YB+' L '+(X1-7)+' '+(YB+4.5)+' Z',fill:C.slate},stat);
txt('prediction of visual cortex',{x:0,y:0,transform:'translate(60 '+((YT+YB)/2+2)+') rotate(-90)','text-anchor':'middle','font-size':16,'font-weight':500,fill:C.blue},stat);
var XM=(CXL+CXH)/2;
txt('effective dimensionality',{x:XM,y:349,'text-anchor':'middle','font-size':17,'font-weight':500,fill:C.inkSoft},stat);
el('line',{x1:XM-92,y1:364,x2:XM+86,y2:364,stroke:C.slate,'stroke-width':1.5,'stroke-linecap':'round'},stat);
el('path',{d:'M '+(XM+85)+' 359.5 L '+(XM+94)+' 364 L '+(XM+85)+' 368.5 Z',fill:C.slate},stat);
txt('log scale',{x:XM,y:386,'text-anchor':'middle','font-size':14,fill:C.slate},stat);
txt('low-dimensional',{x:CXL,y:413,'text-anchor':'middle','font-size':15,fill:C.inkSoft},stat);

function exDot(g,ex,cx,op){ if(op<=.01)return; var G=el('g',{opacity:op},g), y=PY(ex.v);
  el('line',{x1:cx,y1:CY-CR-8,x2:cx,y2:y+10,stroke:C.slate,'stroke-width':1.5,'stroke-dasharray':'2 5','stroke-linecap':'round'},G);
  el('circle',{cx:cx,cy:y,r:6,fill:C.amber,stroke:C.paper,'stroke-width':2},G);
  el('circle',{cx:cx,cy:y,r:7.5,fill:'none',stroke:C.ink,'stroke-width':1.5},G);
}

window.DURATION=9;
window.renderAt=function(t){
  while(dyn.firstChild)dyn.removeChild(dyn.firstChild);
  /* slow turn of both clouds so they read as 3-D; settles before the hold */
  var th=-.35+.7*Math.sin(seg(t,0,7.4)*Math.PI/2);

  /* beat 2: the rest of the layers fill in from low to high dimensionality */
  var gs=el('g',{},dyn);
  PTS.forEach(function(p){var t0=3.0+2.4*p.u, k=ease(seg(t,t0,t0+.35)); if(k<=.01)return;
    el('circle',{cx:PX(p.u).toFixed(1),cy:PY(p.v).toFixed(1),r:(3.3*(.6+.4*k)).toFixed(2),fill:C.amber,opacity:(.5*k).toFixed(3)},gs)});
  var lg=ease(seg(t,2.9,3.4));
  if(lg>.01){var L=el('g',{opacity:lg},dyn);
    el('circle',{cx:X0+22,cy:120,r:3.6,fill:C.amber,opacity:.65},L);
    txt('one DNN layer',{x:X0+33,y:125,'font-size':15,fill:C.slate},L)}

  /* beat 3: the trend */
  var tr=ease(seg(t,5.8,6.8));
  if(tr>.005){var u0=-.025,u1=lerp(u0,1.03,tr);
    el('line',{x1:PX(u0),y1:PY(ICPT+SLOPE*u0),x2:PX(u1),y2:PY(ICPT+SLOPE*u1),stroke:C.ink,'stroke-width':2.5,'stroke-linecap':'round'},dyn)}

  /* beat 0 (poster): a low-dimensional layer and where it sits */
  cloud(dyn,LOW,th,CXL,1);
  exDot(dyn,EXL,CXL,1);

  /* beat 1: a high-dimensional layer: the points spread from a line into the whole volume */
  var ap=ease(seg(t,.7,1.1)), inf=ease(seg(t,1.0,2.0));
  var HP=HI0.map(function(p,i){var q=HI1[i];return [lerp(p[0],q[0],inf),lerp(p[1],q[1],inf),lerp(p[2],q[2],inf)]});
  cloud(dyn,HP,th,CXH,ap);
  var hl=ease(seg(t,1.5,2.0));
  if(hl>.01)txt('high-dimensional',{x:CXH,y:413,'text-anchor':'middle','font-size':15,fill:C.inkSoft,opacity:hl},dyn);
  exDot(dyn,EXH,CXH,ease(seg(t,2.0,2.6)));
};
window.renderAt(0);
})();
</script>
