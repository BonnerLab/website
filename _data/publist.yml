# Featured/Highlighted Publications (highlight: 1)
- title: "An extremely coarse feedback signal is sufficient for learning human-aligned visual representations"
  image: 
  description: How fine-grained does a learning signal need to be for a neural network to see like a human? We trained hundreds of convolutional and transformer networks on tasks that distinguish only a handful of broad, data-driven categories and compared them with macaque electrophysiology, human fMRI, and human similarity judgments. Networks trained on as few as 8 categories match or exceed the neural alignment of 1,000-class models, and they align more closely with human perception than fine-grained, self-supervised, or large-scale vision models. Human-like vision can emerge from remarkably coarse feedback.
  authors: Yash Mehta, Michael F. Bonner
  link:
    url: https://arxiv.org/abs/2605.05556
    display: arXiv
  status: Under review
  year: 2026
  highlight: 1
  pdf: https://arxiv.org/pdf/2605.05556

- title: "High-dimensional structure underlying individual differences in naturalistic visual experience"
  image: id_kelsey.png
  description: We show that individual differences in visual experience emerge from high-dimensional neural activity patterns during naturalistic movie viewing, with distinct latent dimensions capturing behaviorally relevant aspects of perception. This multidimensional geometry, revealed through spectral decomposition, explains inter-individual variability beyond what conventional methods capture.
  authors: Chihye Han, Michael F. Bonner
  link:
    url: https://www.cell.com/current-biology/fulltext/S0960-9822(25)01692-6
    display: Current Biology
  year: 2026
  highlight: 1
  code: https://github.com/kelseyhan-jhu/idiosyncratic-neural-geometry

- title: "Universal dimensions of visual representation"
  image: universal_dim.png
  description: We examined whether visual neural networks align with brain representations due to shared constraints or universal features. Analysis of diverse networks revealed shared latent dimensions for image representation. Comparing these to human fMRI data showed brain-aligned representations are universal across networks. This suggests similarities between artificial and biological vision arise from core universal image representations learned convergently.
  authors: Zirui Chen, Michael F. Bonner
  link:
    url: https://arxiv.org/abs/2408.12804
    display: Science Advances
  year: 2025
  highlight: 1
  code: https://github.com/zche377/universal_dimensions

- title: "Convolutional architectures are cortex-aligned de novo"
  image: untrained_cortex_alignment.png
  description: We find that untrained convolutional neural networks can produce brain-like visual representations. This challenges the view that extensive training is necessary for such similarities. The key factors are the networks' architecture, specifically how they compress spatial information and expand feature information. This suggests that the basic structure of convolutional networks mimics biological vision constraints, allowing for cortex-like representations even without learning from experience.
  authors: Atlas Kazemian, Eric Elmoznino, Michael F. Bonner
  link:
    url: https://www.nature.com/articles/s42256-025-01142-3
    display: Nature Machine Intelligence
  year: 2025
  highlight: 1
  code: https://github.com/akazemian/untrained_models_of_visual_cortex
  twitter: https://x.com/AtlasKazemian/status/1792247850958754080
  press:
    url: https://www.baltimoresun.com/2025/12/11/brainlike-ai/?share=abnwboo2e0wcbastpm0w
    display: The Baltimore Sun
  commentary:
    url: https://www.nature.com/articles/s42256-025-01155-y
    display: Nature Machine Intelligence

- title: "Universal scale-free representations in human visual cortex"
  image: scale_free_reps.png
  description: Is it possible to deeply understand neural representations through dimensionality reduction? Our recent work demonstrates that the visual representations in the human brain require interpretation within high-dimensional spaces. Moreover, we reveal that traditional methods like representational similarity analysis fail to detect this high-dimensional information in cortical activity; instead, a spectral approach is necessary. This research uncovers a vast expanse of uncharted dimensions that conventional techniques have overlooked but may be crucial for decoding the cortical code of human vision.
  authors: Raj Magesh Gauthaman, Brice Ménard, Michael F. Bonner
  link:
    url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1013714
    display: PLOS Computational Biology
  code: https://github.com/BonnerLab/scale-free-visual-cortex
  year: 2025
  highlight: 1

- title: "Neural networks and brains share the gist but not the details: a surprising benefit of image ensembles for encoding models of visual cortex"
  image: 
  description: Artificial neural networks resemble ventral-stream activity but still miss aspects of cortical processing. We show that test-time augmentation (TTA)—averaging features from multiple augmented views of the same image—reliably boosts model–brain similarity without changing the model. This holds across CNNs, ResNets, ViTs, and robust models. Surprisingly, averaging features from semantically similar but visually varied augmentations, including text-guided diffusion samples, can outperform the original image. This suggests that semantic gist, not precise visual detail, drives the improved alignment with high-level visual cortex. 
  authors: Yingqi Rong, Colin Conwell, Michael F. Bonner
  link:
    url: https://openreview.net/forum?id=DtEeVWfgNM 
    display: CCN Proceedings
  code: https://github.com/BonnerLab/diffuse-encoder
  year: 2025
  highlight: 1 

- title: "High-performing neural network models of visual cortex benefit from high latent dimensionality"
  image: high_dimensionality.png
  description: Investigating deep neural networks (DNNs) as models for the visual cortex, we found that higher-dimensional representations in these networks better predict cortical responses and improve learning of new stimuli, challenging the idea that lower dimensionality enhances performance. This indicates that high-dimensional geometries might be advantageous for DNN models of visual processing.
  authors: Eric Elmoznino, Michael F. Bonner
  link:
    url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1011792
    display: PLOS Computational Biology
  year: 2024
  highlight: 1
  code: https://github.com/EricElmoznino/encoder_dimensionality

- title: Perceived Distance Alters Memory for Scene Boundaries
  authors: Alon Hafri, Shreya Wadhwa, Michael F. Bonner
  image: perceived_distance.png
  description: What factors determine when visual memories will include details that go beyond perceptual experience? Here, seven experiments (N = 1,100 adults) explored whether spatial scale-specifically, perceived viewing distance-drives boundary extension. We created fake miniatures by exploiting tilt shift, a photographic effect that selectively reduces perceived distance while preserving other scene properties (e.g., making a distant railway appear like a model train). We found that visual memory is modulated by the spatial scale at which the environment is viewed.
  link:
    url: https://psyarxiv.com/hy3qs
    display: Psychological Science
  year: 2022
  highlight: 0
  pdf: https://osf.io/preprints/psyarxiv/hy3qs
  code: https://osf.io/jrtqw/?view_only=975375af587143bead39dd01dc7307f8


- title: "Scene context is predictive of unconstrained object similarity judgments"
  authors: C. Magri, E. Elmoznino, M.F. Bonner
  image: 
  description: Human judgments of which objects “go together” rely heavily on context, not just visual appearance or word meaning. By modeling which scenes objects tend to appear in, we built contextual prototypes—the average CNN response to the scenes surrounding each object. These prototypes strongly predicted human similarity judgments across many categories, matching or exceeding models based on object images or word embeddings. This shows that natural scene context is a powerful driver of intuitive object similarity.
  link:
    url: https://www.sciencedirect.com/science/article/pii/S0010027723001695
    display: Cognition
  year: 2023
  highlight: 1 
  pdf: papers/scene_context.pdf

- title: "Scene memories are biased toward high-probability views"
  authors: F. Lin, A.A. Hafri, M.F. Bonner
  image: 
  description: "People systematically misremember scene depth - views closer than the typical (“modal”) depth are remembered as farther away (boundary extension), and deeper views are remembered as closer (boundary contraction). These biases align with the statistical distribution of natural scene viewpoints, suggesting memory is pulled toward high-probability views to compensate for noisy or incomplete representations."
  link:
    url: https://psyarxiv.com/c3r8j/
    display: Human Perception and Performance
  year: 2022
  highlight: 0
  pdf: https://psyarxiv.com/c3r8j/download
  code: https://osf.io/y9pue/

