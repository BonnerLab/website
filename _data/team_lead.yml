  bio: |
    Mick Bonner is an Assistant Professor in the [Department of Cognitive Science](https://cogsci.jhu.edu) at Johns Hopkins University, where he has led the lab since 2019. He earned a BS in Biochemistry and Molecular Biology at Penn State and a PhD in Neuroscience at the University of Pennsylvania with Murray Grossman, and stayed at Penn as a postdoctoral fellow. He is a [Humboldt Research Fellow](https://www.humboldt-foundation.de/en/), and his work has been recognized with a [Johns Hopkins Catalyst Award](https://research.jhu.edu/major-initiatives/catalyst-awards/2023-awardees/), IDIES seed funding, and the Cognitive Neuroscience Society's Postdoctoral Fellows Award. He has given keynote talks at the [Conference on Cognitive Computational Neuroscience](https://2023.ccneuro.org/) (2023), the Vision Sciences Society workshop [The AI Revolution in Visual Science](https://www.visionsciences.org/2025-technology-workshop/) (2025), [NEAT 2026](https://www.kietzmannlab.uni-osnabrueck.de/neat2026/) in Osnabrück, and the [BlackboxNLP workshop](https://blackboxnlp.github.io/2019/) at ACL (2019). Selected invited talks include the [Kavli Institute for Theoretical Physics](https://www.kitp.ucsb.edu/activities/deeplearning23), [Janelia Research Campus](https://www.janelia.org/), the [Cognitive Neuroimaging Unit at NeuroSpin](https://joliot.cea.fr/drf/joliot/en/Pages/research_entities/NeuroSpin/unicog.aspx), the NIMH Laboratory of Brain and Cognition, and the [Kavli Neuroscience Discovery Institute](https://kavlijhu.org/). He serves as a Consulting Editor for the *Journal of Cognitive Neuroscience*.
