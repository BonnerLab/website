  bio: >-
    Mick Bonner is an Assistant Professor in the Department of Cognitive Science at Johns Hopkins University, where he has led the lab since 2019.
    He received his PhD in Neuroscience from the University of Pennsylvania with Murray Grossman and remained at Penn as a postdoctoral fellow.
    His research combines large-scale human neuroimaging with deep neural networks to uncover the computational principles of visual representation in the brain.
    He is a Humboldt Research Fellow, and his work has been supported by a Johns Hopkins Catalyst Award, IDIES seed funding, and the NIH.
    He has given keynote talks at the Conference on Cognitive Computational Neuroscience (2023) and NEAT (2026), and serves as a Consulting Editor for the Journal of Cognitive Neuroscience.
